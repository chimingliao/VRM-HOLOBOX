<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Holobox v9.1 Display Fix</title>
    <style>
        /* --- 1. 基礎設定 --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            background-color: #000; margin: 0; padding: 0;
            height: 100dvh; width: 100vw; overflow: hidden;
            font-family: sans-serif; color: white;
            /* 背景深一點，凸顯全息艙 */
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            perspective: 1000px; 
            display: flex; justify-content: center; align-items: center;
        }

        /* Debug Log (紅字) */
        #status-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(50, 0, 0, 0.8); color: #ffaaaa; font-size: 12px;
            padding: 8px; text-align: center; z-index: 9999; pointer-events: none;
            display: none; /* 預設隱藏，有錯才顯示 */
        }

        /* --- 變數系統 --- */
        :root {
            --theme-color: #ffaa00;
            /* 根據手機螢幕比例動態調整盒子大小 */
            --box-w: 85vw;
            --box-h: 70vh; /* 預設高度 */
            --box-d: 40vw;
        }

        /* 確保 9:16 比例，避免盒子變形 */
        @media (orientation: portrait) {
            :root {
                --box-w: 85vw;
                --box-h: calc(85vw * 1.77); /* 16/9 = 1.77 */
                --box-d: 40vw;
            }
        }
        @media (orientation: landscape) {
            :root {
                --box-h: 85vh;
                --box-w: calc(85vh * 0.56); /* 9/16 = 0.56 */
                --box-d: 30vh;
            }
        }

        /* --- 2. 3D 機體 (Machine) --- */
        .machine-container {
            position: absolute;
            width: var(--box-w); height: var(--box-h);
            /* 限制最大高度，防止超出螢幕 */
            max-height: 90dvh;
            max-width: 500px; /* 平板限制 */
            
            transform-style: preserve-3d;
            /* 初始位置：居中 */
            top: 50%; left: 50%;
            transform: translate3d(-50%, -50%, 0) rotateY(0deg) rotateX(0deg);
            z-index: 10;
        }

        /* 正面面板 */
        .face-front {
            position: absolute; width: 100%; height: 100%;
            background: linear-gradient(145deg, #eeeeee, #cccccc);
            border-radius: 16px;
            /* 邊框厚度 */
            padding: 12px; 
            padding-top: 35px; padding-bottom: 35px;
            
            box-shadow: inset 2px 2px 5px rgba(255,255,255,0.8), 0 30px 60px rgba(0,0,0,0.9);
            
            /* 關鍵：Flex 佈局確保螢幕撐滿 */
            display: flex; flex-direction: column; 
            backface-visibility: hidden;
            transform: translateZ(calc(var(--box-d) / 2));
        }

        /* 螢幕邊框 (黑邊) */
        .screen-bezel {
            flex: 1; /* 佔據所有剩餘空間 */
            width: 100%; 
            background: #000; border-radius: 6px;
            position: relative; overflow: hidden;
            border: 2px solid #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            
            /* 關鍵：再次使用 Flex 讓 canvas 撐滿 */
            display: flex;
        }

        /* 螢幕顯示區 (真正放 Canvas 的地方) */
        .holobox-screen {
            width: 100%; height: 100%;
            position: relative;
        }

        /* Canvas 強制撐滿 */
        #hologram-canvas { 
            width: 100% !important; 
            height: 100% !important; 
            display: block; 
            outline: none;
        }

        /* 玻璃反光 */
        .glass-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(125deg, transparent 30%, rgba(255,255,255,0.05) 40%, transparent 50%);
            pointer-events: none; z-index: 20;
        }

        /* 側面構造 */
        .side { position: absolute; background: #1a1a1a; border: 1px solid #333; }
        .s-right { width: var(--box-d); height: 100%; right: 0; transform-origin: right; transform: rotateY(-90deg); }
        .s-left { width: var(--box-d); height: 100%; left: 0; transform-origin: left; transform: rotateY(90deg); }
        .s-top { width: 100%; height: var(--box-d); top: 0; transform-origin: top; transform: rotateX(-90deg); background: #222; }
        .s-bottom { width: 100%; height: var(--box-d); bottom: 0; transform-origin: bottom; transform: rotateX(90deg); }
        .s-back { width: 100%; height: 100%; transform: translateZ(calc(var(--box-d) * -1)); background: #111; border: 1px solid #333; }

        /* 裝飾 */
        .sensor-bar { position: absolute; top: 12px; width: 100%; display: flex; justify-content: center; gap: 8px; }
        .dot { width: 6px; height: 6px; background: #222; border-radius: 50%; }
        .speaker-mesh { position: absolute; bottom: 12px; width: 60%; height: 10px; background: radial-gradient(#666 1px, transparent 1px); background-size: 3px 3px; opacity: 0.4; align-self: center; }

        /* --- 3. UI --- */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); z-index: 2000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 20px; text-align: center;
        }
        .setup-card { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #333; width: 100%; max-width: 320px; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; background: #333; color: white; margin-bottom: 10px; }
        .btn-primary { background: var(--theme-color); color: black; font-weight: bold; margin-top: 20px; }
        .btn-primary:disabled { background: #555; color: #888; }

        /* 右上角設定按鈕 */
        .fab-btn { 
            position: fixed; top: 30px; right: 20px; width: 44px; height: 44px; border-radius: 50%; 
            background: rgba(255,255,255,0.15); backdrop-filter: blur(8px); 
            display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; z-index: 100; 
        }
        
        /* 底部面板 */
        #bottom-sheet {
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(20,20,20,0.95); backdrop-filter: blur(20px);
            border-radius: 24px 24px 0 0; z-index: 1000; transform: translateY(110%); transition: transform 0.3s ease;
            padding: 20px; padding-bottom: calc(20px + var(--safe-bottom)); max-height: 60dvh; overflow-y: auto; border-top: 1px solid #333;
        }
        #bottom-sheet.open { transform: translateY(0); }
        
        .control-group { margin-bottom: 15px; }
        .label-row { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; margin-bottom: 6px; }
        input[type=range] { width: 100%; height: 20px; -webkit-appearance: none; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; background: #444; border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: var(--theme-color); margin-top: -8px; }

        #webcam-pip { position: fixed; top: 30px; left: 20px; width: 70px; height: 93px; background: #000; border: 1px solid #333; border-radius: 6px; overflow: hidden; z-index: 90; opacity: 0; pointer-events: none; transition: 0.3s; }
        #webcam-pip.active { opacity: 1; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        #loader-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; font-size: 12px; }
    </style>

    <!-- 標準 Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
            "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js",
            "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.0.0/lib/three-vrm-animation.module.js",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>
</head>
<body>

    <div id="status-bar"></div>

    <!-- 啟動 -->
    <div id="start-overlay">
        <div class="setup-card">
            <h1 style="color:var(--theme-color); margin:0 0 10px;">HOLOBOX</h1>
            <p style="color:#888; font-size:13px;">v9.1 Display Fix</p>
            
            <input type="file" id="file-vrm" accept=".vrm" style="display:none">
            <button class="btn" onclick="document.getElementById('file-vrm').click()">
                📂 1. 選擇 VRM 模型
            </button>
            <div id="file-name" style="color:var(--theme-color); font-size:12px; height:20px;"></div>

            <button id="btn-go" class="btn btn-primary" disabled onclick="startApp()">
                2. 啟動
            </button>
        </div>
    </div>

    <!-- 主機體 -->
    <div class="machine-container" id="machine">
        <div class="face-front">
            <div class="sensor-bar"><div class="dot"></div><div class="cam-dot"></div><div class="dot"></div></div>
            <div class="screen-bezel">
                <!-- 這裡確保 holobox-screen 撐滿 bezel -->
                <div class="holobox-screen" id="screen-container">
                    <div class="glass-layer"></div>
                    <div id="loader-text"></div>
                    <canvas id="hologram-canvas"></canvas>
                </div>
            </div>
            <div class="speaker-mesh"></div>
        </div>
        <div class="side s-right"></div><div class="side s-left"></div>
        <div class="side s-top"></div><div class="side s-bottom"></div><div class="side s-back"></div>
    </div>

    <!-- UI -->
    <div class="fab-btn" onclick="toggleSheet()">⚙️</div>
    <div id="webcam-pip"><video id="webcam-vid" autoplay playsinline muted></video></div>

    <div id="bottom-sheet">
        <div style="text-align:right; margin-bottom:10px;" onclick="toggleSheet()">✕</div>
        
        <div class="control-group">
            <div class="label-row"><span>動作 (.vrma)</span></div>
            <input type="file" id="file-vrma" accept=".vrma" style="display:none">
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex:1;" onclick="document.getElementById('file-vrma').click()">➕ 加載</button>
                <button class="btn" style="flex:1; background:#622;" onclick="resetPose()">■ 停止</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>追蹤 (點擊開啟)</span></div>
            <div style="display:flex; gap:10px;">
                <button class="btn" style="flex:1;" onclick="startWebcam()">📷 攝像頭</button>
                <button class="btn" style="flex:1;" onclick="startGyro()">📱 陀螺儀</button>
            </div>
        </div>

        <div class="control-group">
            <div class="label-row"><span>人物 Y</span><span id="val-y">-1.0</span></div>
            <input type="range" id="sld-y" min="-2.0" max="0.5" step="0.05" value="-1.0">
        </div>
        <div class="control-group">
            <div class="label-row"><span>人物 Scale</span><span id="val-s">1.0</span></div>
            <input type="range" id="sld-s" min="0.5" max="2.0" step="0.05" value="1.0">
        </div>
        
        <button class="btn" style="background:transparent; border:1px solid #444;" onclick="resetAll()">重置位置</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { createVRMAnimationClip, VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        // 預設模型
        let modelUrl = 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@master/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';
        
        let scene, camera, renderer, currentVrm, mixer, currentAction;
        let faceLandmarker, isGyro = false;
        const state = { rotY: 0, rotX: 0, modelY: -1.0, modelS: 1.0, camX: 0, camY: 0 };

        function log(msg, isError) {
            const el = document.getElementById('status-bar');
            if(isError) { el.innerText = msg; el.style.display = 'block'; }
            console.log(msg);
        }
        window.toggleSheet = () => document.getElementById('bottom-sheet').classList.toggle('open');

        // --- 1. 檔案 ---
        document.getElementById('file-vrm').onchange = (e) => {
            if(e.target.files[0]) {
                modelUrl = URL.createObjectURL(e.target.files[0]);
                document.getElementById('file-name').innerText = e.target.files[0].name;
                const btn = document.getElementById('btn-go');
                btn.disabled = false; btn.style.background = "#ffaa00";
            }
        };

        // --- 2. 啟動 ---
        window.startApp = () => {
            document.getElementById('start-overlay').style.display = 'none';
            initThree();
            loadVRM(modelUrl);
        };

        // --- 3. Three.js (關鍵修正：Resize 邏輯) ---
        function initThree() {
            const canvas = document.getElementById('hologram-canvas');
            const container = document.getElementById('screen-container');
            
            // 獲取容器的實際大小，而不是 Canvas 預設大小
            const width = container.clientWidth;
            const height = container.clientHeight;

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setSize(width, height); // 強制設定大小
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            // 判斷是否為手機 (螢幕窄) -> 調整相機距離
            const isMobile = window.innerWidth < 768;
            const camZ = isMobile ? 3.0 : 4.0; // 手機上靠更近 (3.0)

            camera = new THREE.PerspectiveCamera(30, width / height, 0.1, 20.0);
            camera.position.set(0, 0.85, camZ);

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(2, 5, 5);
            scene.add(light);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.0));

            // 房間
            const room = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 4), new THREE.MeshStandardMaterial({ color: 0x222222, side: THREE.BackSide }));
            room.position.y = 0.5; scene.add(room);
            scene.add(new THREE.GridHelper(4, 10, 0x555555, 0x222222));

            animate();
            
            // 立即觸發一次 Resize 確保正確
            handleResize();
        }

        // --- 4. 載入模型 ---
        function loadVRM(url) {
            const loaderText = document.getElementById('loader-text');
            loaderText.innerText = "載入中...";

            const loader = new GLTFLoader();
            loader.register(parser => new VRMLoaderPlugin(parser));

            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                if(!vrm) { log("非 VRM 檔案", true); return; }

                VRMUtils.rotateVRM0(vrm);
                if(currentVrm) { scene.remove(currentVrm.scene); VRMUtils.deepDispose(currentVrm.scene); }
                
                currentVrm = vrm;
                scene.add(vrm.scene);
                mixer = new THREE.AnimationMixer(vrm.scene);
                
                resetPose();
                updateModelTransform();
                loaderText.style.display = 'none';
            }, 
            (p) => loaderText.innerText = `${Math.round((p.loaded/p.total)*100)}%`,
            (e) => log("載入錯誤", true));
        }

        // --- 5. 動作 ---
        document.getElementById('file-vrma').onchange = (e) => {
            if(e.target.files[0]) loadVRMA(URL.createObjectURL(e.target.files[0]));
        };

        function loadVRMA(url) {
            if(!currentVrm) return;
            const loader = new GLTFLoader();
            loader.register(parser => new VRMAnimationLoaderPlugin(parser));
            loader.load(url, (gltf) => {
                const vrmAnim = gltf.userData.vrmAnimations?.[0];
                if(vrmAnim) {
                    const clip = createVRMAnimationClip(vrmAnim, currentVrm);
                    if(mixer) {
                        if(currentAction) currentAction.stop();
                        currentAction = mixer.clipAction(clip);
                        currentAction.play();
                    }
                }
            });
        }

        window.resetPose = () => {
            if(currentAction) currentAction.stop();
            if(currentVrm && currentVrm.humanoid) {
                currentVrm.humanoid.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2;
                currentVrm.humanoid.getNormalizedBoneNode('rightUpperArm').rotation.z = -1.2;
            }
        };

        // --- 6. UI ---
        function updateModelTransform() {
            if(!currentVrm) return;
            currentVrm.scene.position.y = state.modelY;
            currentVrm.scene.scale.set(state.modelS, state.modelS, state.modelS);
        }
        document.getElementById('sld-y').addEventListener('input', (e) => { state.modelY = parseFloat(e.target.value); document.getElementById('val-y').innerText = state.modelY; updateModelTransform(); });
        document.getElementById('sld-s').addEventListener('input', (e) => { state.modelS = parseFloat(e.target.value); document.getElementById('val-s').innerText = state.modelS; updateModelTransform(); });

        window.resetAll = () => {
            state.modelY = -1.0; state.modelS = 1.0; state.rotY = 0; state.rotX = 0;
            document.getElementById('sld-y').value = -1.0; document.getElementById('sld-s').value = 1.0;
            updateModelTransform();
            document.getElementById('machine').style.transform = `translate3d(-50%, -50%, 0) rotateY(0deg) rotateX(0deg)`;
        };

        // --- 7. Tracking ---
        window.startWebcam = async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                document.getElementById('webcam-vid').srcObject = stream;
                document.getElementById('webcam-pip').classList.add('active');
                
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" }, runningMode: "VIDEO", numFaces: 1 });
                isGyro = false; trackLoop();
            } catch(e) { log("相機失敗", true); }
        };

        async function trackLoop() {
            if(!isGyro && faceLandmarker) {
                const vid = document.getElementById('webcam-vid');
                if(vid.currentTime > 0) {
                    const res = faceLandmarker.detectForVideo(vid, performance.now());
                    if(res.faceLandmarks.length) {
                        const nose = res.faceLandmarks[0][1];
                        state.camX += ((nose.x - 0.5) * -2.0 - state.camX) * 0.1;
                        state.camY += ((nose.y - 0.5) * -1.0 - state.camY) * 0.1;
                    }
                }
            }
            requestAnimationFrame(trackLoop);
        }

        window.startGyro = () => {
            if(typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(r => r==='granted'?bindGyro():alert('Refused'));
            } else bindGyro();
        };

        function bindGyro() {
            isGyro = true; 
            document.getElementById('webcam-pip').classList.remove('active');
            window.addEventListener('deviceorientation', (e) => {
                let x = e.gamma || 0; let y = e.beta || 0;
                if(x > 45) x = 45; if(x < -45) x = -45; if(y > 135) y = 135; if(y < 45) y = 45; 
                state.camX = x * 0.02; state.camY = (y - 90) * 0.02; 
            });
        }

        // --- 8. Render ---
        function animate() {
            requestAnimationFrame(animate);
            const d = new THREE.Clock().getDelta();
            if(currentVrm) { currentVrm.update(d); currentVrm.lookAt.target = camera; }
            if(mixer) mixer.update(d);

            camera.position.x = state.camX;
            camera.position.y = 0.85 + state.camY; 
            camera.lookAt(0, 0.85, 0);
            renderer.render(scene, camera);
        }

        let tx = 0, ty = 0;
        document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
        document.addEventListener('touchmove', e => {
            if(e.target.closest('#bottom-sheet')) return;
            const dx = e.touches[0].clientX - tx; const dy = e.touches[0].clientY - ty;
            state.rotY += dx * 0.5; state.rotX -= dy * 0.5;
            document.getElementById('machine').style.transform = `translate3d(-50%, -50%, 0) rotateY(${state.rotY}deg) rotateX(${state.rotX}deg)`;
            tx = e.touches[0].clientX; ty = e.touches[0].clientY;
        });

        // 關鍵修正：正確的 Resize 邏輯
        function handleResize() {
            const container = document.getElementById('screen-container');
            const w = container.clientWidth; 
            const h = container.clientHeight;
            renderer.setSize(w, h);
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
        }
        window.addEventListener('resize', handleResize);
    </script>
</body>
</html>
