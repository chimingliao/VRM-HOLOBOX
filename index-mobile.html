<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Holobox v6.3 - Safe Boot</title>
    <style>
        /* --- 基礎樣式 (保持不變) --- */
        body { background-color: #050505; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; overflow: hidden; color: white; background: radial-gradient(circle at center, #1a1a1a 0%, #000000 90%); perspective: 2000px; touch-action: none; }
        :root { --screen-h: 75vh; --screen-ratio: 0.5625; --case-depth: 300px; }
        @media (max-width: 768px) { :root { --screen-h: 60vh; --case-depth: 200px; } }

        /* UI Overlay */
        #error-log { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(220, 20, 60, 0.9); padding: 12px 24px; border-radius: 8px; display: none; z-index: 9999; font-size: 14px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); pointer-events: none; white-space: nowrap; }
        
        #setup-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 10, 0.95); z-index: 200; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; backdrop-filter: blur(5px); }
        .setup-box { background: #1a1a1a; padding: 30px; border-radius: 16px; border: 1px solid #333; text-align: center; width: 85%; max-width: 320px; }
        .btn { display: block; width: 100%; padding: 12px; margin-top: 15px; background: #333; color: white; border: 1px solid #555; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn:hover { border-color: #ffaa00; color: #ffaa00; }
        .btn-primary { background: #ffaa00; color: black; border: none; font-weight: bold; margin-top: 20px; font-size: 16px; }
        .btn-primary:disabled { background: #444; color: #888; cursor: not-allowed; opacity: 0.6; }
        .btn-secondary { background: transparent; border: 1px solid #555; color: #888; margin-top: 10px; font-size: 12px; }

        /* Controls Layout */
        .ui-container { position: absolute; z-index: 100; transition: 0.3s ease; }
        @media (min-width: 769px) { .ui-container { right: 40px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-end; gap: 15px; max-height: 90vh; } .mobile-toggle { display: none; } #controls-panel { display: block !important; } }
        @media (max-width: 768px) { .ui-container { bottom: 0; left: 0; width: 100%; display: flex; flex-direction: column-reverse; } #webcam-container { position: fixed !important; top: 20px; left: 20px; width: 100px !important; height: 75px !important; opacity: 0.7; } #controls-panel { width: 100% !important; border-radius: 20px 20px 0 0 !important; max-height: 60vh !important; transform: translateY(100%); background: rgba(20, 20, 20, 0.95) !important; } #controls-panel.open { transform: translateY(0); } .mobile-toggle { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: #ffaa00; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(255, 170, 0, 0.4); font-size: 24px; color: black; cursor: pointer; z-index: 110; } }

        #webcam-container { position: relative; width: 160px; height: 120px; border-radius: 8px; overflow: hidden; border: 2px solid #333; display: none; transform: scaleX(-1); background: #000; pointer-events: auto; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        #webcam-container.tracking { border-color: #ffaa00; box-shadow: 0 0 15px #ffaa00; }
        video { width: 100%; height: 100%; object-fit: cover; }

        #controls-panel { width: 280px; background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(10px); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5); overflow-y: auto; pointer-events: auto; box-sizing: border-box; }
        h3 { margin: 15px 0 8px 0; color: #ffaa00; font-size: 12px; text-transform: uppercase; border-bottom: 1px solid rgba(255, 170, 0, 0.3); padding-bottom: 5px; }
        h3:first-child { margin-top: 0; }
        .control-group { margin-bottom: 12px; }
        .control-label { display: flex; justify-content: space-between; font-size: 12px; color: #ccc; margin-bottom: 6px; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #ffaa00; height: 20px; }
        .toggle-btn { background: rgba(255, 170, 0, 0.15); border: 1px solid #ffaa00; color: #ffaa00; margin-top: 0; margin-bottom: 15px;}
        #anim-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .anim-btn { background: #222; border: 1px solid #444; color: #ddd; padding: 10px; font-size: 13px; cursor: pointer; text-align: left; border-radius: 6px; transition: 0.2s; display: flex; align-items: center; }
        .anim-btn.active { background: #ffaa00; color: #000; border-color: #ffaa00; font-weight: bold; }
        .anim-icon { margin-right: 8px; font-size: 10px; }

        /* 3D Machine */
        .machine-assembly { position: relative; transform-style: preserve-3d; transform: rotateY(0deg) rotateX(10deg); transform-origin: center center calc(var(--case-depth) / -2); transition: transform 0.1s linear; }
        .face-front { width: calc(var(--screen-h) * var(--screen-ratio) + 40px); background: linear-gradient(145deg, #ffffff, #e0e0e0); border-radius: 12px; padding: 20px; padding-top: 40px; padding-bottom: 40px; box-shadow: inset 2px 2px 5px rgba(255,255,255,1); position: relative; display: flex; flex-direction: column; align-items: center; backface-visibility: hidden; }
        .face-side { position: absolute; background: #111; border: 1px solid #222; background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPgo8cmVjdCB3aWR0aD0iNCIgaGVpZ2h0PSI0IiBmaWxsPSIjMTExIi8+CjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiMyMjIiLz4KPC9zdmc+'); }
        .side-right { width: var(--case-depth); height: 100%; top: 0; right: 0; transform-origin: right center; transform: rotateY(-90deg); }
        .side-left { width: var(--case-depth); height: 100%; top: 0; left: 0; transform-origin: left center; transform: rotateY(90deg); }
        .side-top { width: 100%; height: var(--case-depth); top: 0; left: 0; transform-origin: top center; transform: rotateX(-90deg); background: #1a1a1a; }
        .side-bottom { width: 100%; height: var(--case-depth); bottom: 0; left: 0; transform-origin: bottom center; transform: rotateX(90deg); box-shadow: 0 0 80px rgba(0,0,0,0.8); }
        .side-back { width: 100%; height: 100%; top: 0; left: 0; transform: translateZ(calc(var(--case-depth) * -1)) rotateY(180deg); background: #0d0d0d; border: 1px solid #333; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; }
        .screen-bezel { width: 100%; height: var(--screen-h); background: #000; border-radius: 4px; padding: 5px; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); position: relative; z-index: 10; }
        .holobox-screen { width: 100%; height: 100%; background: #000; position: relative; overflow: hidden; border-radius: 2px; }
        .glass-glare { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.0) 50%); pointer-events: none; z-index: 20; }
        #hologram-canvas { width: 100%; height: 100%; display: block; }
        #loading-indicator { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ffaa00; font-size: 14px; display: none; z-index: 30; font-weight: bold; }
        .touch-hint { position: fixed; bottom: 100px; width: 100%; text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; pointer-events: none; animation: fadeOut 5s forwards; }
        @keyframes fadeOut { 0% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
        
        .speaker-grill { position: absolute; bottom: 12px; width: 60%; height: 16px; background-image: radial-gradient(#999 1px, transparent 1px); background-size: 3px 3px; opacity: 0.5; }
        .sensor-array { position: absolute; top: 15px; width: 100%; text-align: center; }
        .camera-dot { width: 8px; height: 8px; background: #111; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 2px rgba(255,255,255,0.5); }
        .sensor-dot { width: 4px; height: 4px; background: #333; border-radius: 50%; display: inline-block; margin: 0 5px; }
        .vent-holes { width: 80%; height: 60%; background-image: radial-gradient(#333 2px, transparent 2px); background-size: 10px 10px; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.169.0",
            "three/addons/": "https://esm.sh/three@0.169.0/examples/jsm/",
            "@pixiv/three-vrm": "https://esm.sh/@pixiv/three-vrm@3.0.0?deps=three@0.169.0",
            "@pixiv/three-vrm-animation": "https://esm.sh/@pixiv/three-vrm-animation@3.0.0?deps=three@0.169.0,@pixiv/three-vrm@3.0.0",
            "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.3"
        }
    }
    </script>
</head>
<body>

    <!-- 全局錯誤顯示 (方便除錯) -->
    <div id="error-log"></div>

    <!-- 啟動面板 -->
    <div id="setup-overlay">
        <div class="setup-box">
            <h1 style="color:#ffaa00; margin:0 0 10px 0;">HOLOBOX v6.3</h1>
            <p style="font-size:12px; color:#aaa; margin-bottom:20px;">Safe Mode</p>
            
            <!-- 模型上傳區 -->
            <input type="file" id="vrm-upload" accept=".vrm" style="display:none">
            <button class="btn" onclick="document.getElementById('vrm-upload').click()">📂 載入本機 VRM</button>
            <div id="file-status" style="margin-top: 8px; font-size: 12px; color: #ffaa00; min-height: 18px;">使用預設模型中</div>
            
            <button id="launch-btn" class="btn btn-primary" disabled>初始化中...</button>
            <button class="btn btn-secondary" onclick="forceStart()">⚠ 跳過 AI (強制啟動)</button>
        </div>
    </div>

    <div class="touch-hint" id="touch-hint" style="display:none;">👆 拖曳畫面可旋轉全息艙</div>

    <!-- UI 側邊欄 -->
    <div class="ui-container">
        <div class="mobile-toggle" onclick="toggleMobileMenu()">⚙️</div>
        <div id="webcam-container"><video id="webcam-video" autoplay playsinline muted></video></div>

        <div id="controls-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;" onclick="toggleMobileMenu()">
                <h3 style="margin:0;">Settings</h3><span style="color:#666;">▼</span>
            </div>

            <button class="btn toggle-btn" onclick="toggleWebcam()">📷 攝像頭開關</button>
            
            <!-- 動作上傳區 -->
            <h3>Motion Control</h3>
            <input type="file" id="vrma-upload" accept=".vrma" style="display:none">
            <button class="btn" style="margin:0 0 10px; background:#444;" onclick="document.getElementById('vrma-upload').click()">➕ 加載動作 (.vrma)</button>
            <div id="anim-list"></div>
            <button class="btn" style="padding:5px; font-size:12px; background:rgba(255,100,100,0.2); color:#ffaaaa; border-color:rgba(255,100,100,0.5);" onclick="stopAnimation()">■ 停止動作</button>

            <h3 style="margin-top:20px;">Rotation</h3>
            <div class="control-group"><div class="control-label"><span>Y (L/R)</span><span id="val-rotY">0</span></div><input type="range" id="inp-rotY" min="-90" max="90" step="1" value="0"></div>
            <div class="control-group"><div class="control-label"><span>X (U/D)</span><span id="val-rotX">10</span></div><input type="range" id="inp-rotX" min="-45" max="45" step="1" value="10"></div>
            
            <h3>Settings</h3>
            <div class="control-group"><div class="control-label"><span>Max Shift</span><span id="val-lim">2.5</span></div><input type="range" id="inp-lim" min="0.5" max="5.0" step="0.1" value="2.5"></div>
            <div class="control-group"><div class="control-label"><span>Scale</span><span id="val-s">1.0</span></div><input type="range" id="inp-s" min="0.5" max="2.0" step="0.05" value="1.0"></div>
            
            <button class="btn" style="background:rgba(255,255,255,0.1); border:none; padding:8px; font-size:12px;" onclick="resetAll()">↺ 重置</button>
            <div style="height:20px;"></div>
        </div>
    </div>

    <!-- 3D 結構 -->
    <div class="machine-assembly" id="machine-body">
        <div class="face-front">
            <div class="sensor-array"><span class="sensor-dot"></span><span class="camera-dot"></span><span class="sensor-dot"></span></div>
            <div class="screen-bezel">
                <div class="holobox-screen">
                    <div class="glass-glare"></div>
                    <div id="loading-indicator">WAITING...</div>
                    <canvas id="hologram-canvas"></canvas>
                </div>
            </div>
            <div class="speaker-grill"></div>
        </div>
        <div class="face-side side-right"></div><div class="face-side side-left"></div>
        <div class="face-side side-top"></div><div class="face-side side-bottom"></div><div class="face-side side-back"><div class="vent-holes"></div></div>
    </div>
    
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
        import { createVRMAnimationClip, VRMAnimationLoaderPlugin } from '@pixiv/three-vrm-animation';
        import { FilesetResolver, FaceLandmarker } from '@mediapipe/tasks-vision';

        // --- 全域變數 ---
        let modelUrl = 'https://cdn.jsdelivr.net/gh/pixiv/three-vrm@master/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';
        let scene, camera, renderer, currentVrm, mixer, currentAction;
        let faceLandmarker, video, lastVideoTime = -1;
        let setupComplete = false;
        let roomMesh, roomEdges, gridHelper, mainLight, innerFrameGroup;
        const defaultTransform = { x: 0, y: -1.2, scale: 1.0, rot: 180 };
        const defaultStage = { width: 3.5, depth: 3.0, height: 4.0, brightness: 1.5, limit: 2.5 };
        let transform = { ...defaultTransform };
        let stage = { ...defaultStage };
        let boxRotationY = 0, boxRotationX = 10;

        function logError(msg) { 
            const el = document.getElementById('error-log'); 
            el.style.display = 'block'; el.innerText = msg; 
            setTimeout(() => { el.style.display = 'none'; }, 5000);
            console.error(msg); 
        }
        window.toggleMobileMenu = () => { document.getElementById('controls-panel').classList.toggle('open'); };

        // --- Main Initialization Logic (Wait for DOM) ---
        window.addEventListener('DOMContentLoaded', async () => {
            
            initScene();
            animate();
            window.addEventListener('resize', resizeRenderer);

            const launchBtn = document.getElementById('launch-btn');
            const statusText = document.getElementById('file-status');

            // AI Init
            try {
                launchBtn.innerText = "初始化攝像頭...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video = document.getElementById('webcam-video');
                video.srcObject = stream;
                await new Promise(r => video.onloadeddata = r);

                launchBtn.innerText = "下載 AI 模型...";
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task`, delegate: "GPU" }, runningMode: "VIDEO", numFaces: 1 });
                
                setupComplete = true;
                launchBtn.innerText = "啟動全息艙";
                launchBtn.disabled = false;
            } catch(e) {
                console.warn("AI Failed:", e);
                setupComplete = true; 
                launchBtn.innerText = "AI 失敗 (可強制啟動)";
                launchBtn.disabled = false;
                document.querySelector('.btn-secondary').style.display = "block";
            }

            // UI Event Bindings
            launchBtn.onclick = () => {
                if(modelUrl && setupComplete) startGame();
                else if(!modelUrl) alert("請先載入模型");
            };

            // Safe Element binding
            const vrmInput = document.getElementById('vrm-upload');
            if(vrmInput) {
                vrmInput.onchange = (e) => {
                    const file = e.target.files[0];
                    if(file) {
                        const localUrl = URL.createObjectURL(file);
                        modelUrl = localUrl;
                        statusText.innerText = "已選: " + file.name;
                        // If already running, load immediately
                        if(document.getElementById('setup-overlay').style.opacity === '0') loadVRM(localUrl);
                    }
                };
            }

            const vrmaInput = document.getElementById('vrma-upload');
            if(vrmaInput) {
                vrmaInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if(file) loadVRMAnimation(URL.createObjectURL(file), file.name);
                });
            }

            // Bind Sliders
            bindSliders();
        });

        window.forceStart = () => { faceLandmarker = null; startGame(); }

        function startGame() {
            const overlay = document.getElementById('setup-overlay'); overlay.style.opacity = 0;
            setTimeout(() => { 
                overlay.style.display = 'none'; 
                if(window.innerWidth < 768) document.getElementById('touch-hint').style.display = 'block';
                else { document.getElementById('controls-panel').style.display = 'block'; document.getElementById('webcam-container').style.display = 'block'; }
            }, 500);
            loadVRM(modelUrl);
            if(faceLandmarker) trackLoop();
        }

        // --- VRM Functions ---
        function loadVRM(url) {
            const loadingEl = document.getElementById('loading-indicator');
            loadingEl.style.display = 'block'; loadingEl.innerText = "LOADING...";

            if (currentVrm) { scene.remove(currentVrm.scene); VRMUtils.deepDispose(currentVrm.scene); currentVrm = null; }
            if(mixer) { mixer.stopAllAction(); mixer = null; }

            const loader = new GLTFLoader();
            loader.register((parser) => new VRMLoaderPlugin(parser));
            
            loader.load(url, (gltf) => {
                const vrm = gltf.userData.vrm;
                if(!vrm) { logError("非有效 VRM 檔案"); return; }
                VRMUtils.rotateVRM0(vrm);
                currentVrm = vrm;
                vrm.scene.traverse((obj) => { if (obj.isMesh) { obj.castShadow = true; obj.receiveShadow = true; } });
                scene.add(vrm.scene);
                mixer = new THREE.AnimationMixer(currentVrm.scene);
                if (vrm.humanoid) resetPose(vrm);
                applyTransform();
                loadingEl.style.display = 'none';
            }, undefined, (e) => {
                loadingEl.style.display = 'none';
                logError("載入失敗: " + e.message);
            });
        }

        function resetPose(vrm) {
            const lArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
            const rArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
            if(lArm) lArm.rotation.z = Math.PI / 2.5;
            if(rArm) rArm.rotation.z = -Math.PI / 2.5;
        }

        // --- Animation Functions ---
        function loadVRMAnimation(url, filename) {
            if(!currentVrm) { alert("請先載入 VRM 模型"); return; }
            const loader = new GLTFLoader();
            loader.register((parser) => new VRMAnimationLoaderPlugin(parser));
            loader.load(url, (gltf) => {
                const vrmAnimations = gltf.userData.vrmAnimations;
                if (vrmAnimations && vrmAnimations.length > 0) {
                    const vrmClip = createVRMAnimationClip(vrmAnimations[0], currentVrm);
                    if(vrmClip) addAnimButton(filename, vrmClip);
                    else logError("動畫解析失敗");
                } else logError("無效的 VRMA");
            }, undefined, (e) => logError("動畫錯誤: " + e.message));
        }

        function addAnimButton(name, clip) {
            const list = document.getElementById('anim-list');
            const btn = document.createElement('div');
            btn.className = 'anim-btn'; btn.innerHTML = `<span class="anim-icon">▶</span> ${name}`;
            btn.onclick = () => {
                document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if(currentAction) currentAction.stop();
                if(mixer) { currentAction = mixer.clipAction(clip); currentAction.play(); }
            };
            list.appendChild(btn); btn.click();
        }

        window.stopAnimation = () => {
            if(currentAction) currentAction.stop();
            document.querySelectorAll('.anim-btn').forEach(b => b.classList.remove('active'));
            if(currentVrm && currentVrm.humanoid) resetPose(currentVrm);
        };

        // --- Scene & Logic ---
        function initScene() {
            const canvas = document.getElementById('hologram-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            resizeRenderer();
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x111111);
            camera = new THREE.PerspectiveCamera(45.0, canvas.clientWidth / canvas.clientHeight, 0.1, 20.0);
            camera.position.set(0.0, 0.5, 4.5); 
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0); hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
            mainLight = new THREE.DirectionalLight(0xffffff, stage.brightness); mainLight.position.set(2, 5, 5); mainLight.castShadow = true; mainLight.shadow.mapSize.width = 1024; mainLight.shadow.mapSize.height = 1024; scene.add(mainLight);
            const backLight = new THREE.DirectionalLight(0x00aaff, 0.8); backLight.position.set(-2, 2, -3); scene.add(backLight);
            createStageObjects();
        }

        function createStageObjects() {
            const geo = new THREE.BoxGeometry(1, 1, 1); const mat = new THREE.MeshStandardMaterial({ color: 0x333333, side: THREE.BackSide, roughness: 0.7 });
            roomMesh = new THREE.Mesh(geo, mat); roomMesh.position.y = 0.8; roomMesh.receiveShadow = true; scene.add(roomMesh);
            const edges = new THREE.EdgesGeometry(geo); const line = new THREE.LineBasicMaterial({ color: 0xffaa00, linewidth: 2 });
            roomEdges = new THREE.LineSegments(edges, line); roomEdges.position.copy(roomMesh.position); scene.add(roomEdges);
            gridHelper = new THREE.GridHelper(1, 10, 0x666666, 0x222222); scene.add(gridHelper);
            innerFrameGroup = new THREE.Group();
            const frameMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            ['top','bottom','left','right'].forEach(n => { const m = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), frameMat); m.name = n; innerFrameGroup.add(m); });
            innerFrameGroup.position.y = 0.8; scene.add(innerFrameGroup);
            updateStage();
        }

        function updateStage() {
            if(!roomMesh) return;
            roomMesh.scale.set(stage.width, stage.height, stage.depth);
            roomEdges.scale.set(stage.width, stage.height, stage.depth);
            const floorY = roomMesh.position.y - (stage.height / 2);
            scene.remove(gridHelper);
            gridHelper = new THREE.GridHelper(stage.width, 10, 0x666666, 0x222222);
            gridHelper.position.y = floorY + 0.01; gridHelper.position.z = 0; scene.add(gridHelper);
            const frontZ = (stage.depth / 2); const barSize = 2.0;
            innerFrameGroup.children.forEach(mesh => {
                if(mesh.name === "top") { mesh.scale.set(stage.width + barSize*2, 2, 1); mesh.position.set(0, stage.height/2 + 1, frontZ); }
                if(mesh.name === "bottom") { mesh.scale.set(stage.width + barSize*2, 2, 1); mesh.position.set(0, -stage.height/2 - 1, frontZ); }
                if(mesh.name === "left") { mesh.scale.set(2, stage.height + barSize*2, 1); mesh.position.set(-stage.width/2 - 1, 0, frontZ); }
                if(mesh.name === "right") { mesh.scale.set(2, stage.height + barSize*2, 1); mesh.position.set(stage.width/2 + 1, 0, frontZ); }
            });
            if(mainLight) mainLight.intensity = stage.brightness;
        }

        // UI Logic
        const inputs = {};
        const displays = {};
        const ids = ['rotY', 'rotX', 'sw', 'sd', 'li', 'lim', 'y', 's'];

        function bindSliders() {
            ids.forEach(id => {
                inputs[id] = document.getElementById('inp-' + id);
                displays[id] = document.getElementById('val-' + id);
                if(inputs[id]) inputs[id].addEventListener('input', updateFromUI);
            });
        }

        function updateFromUI() {
            if(!inputs.rotY) return;
            boxRotationY = parseInt(inputs.rotY.value); boxRotationX = parseInt(inputs.rotX.value);
            stage.width = parseFloat(inputs.sw.value); stage.depth = parseFloat(inputs.sd.value); stage.brightness = parseFloat(inputs.li.value); stage.limit = parseFloat(inputs.lim.value);
            transform.y = parseFloat(inputs.y.value); transform.scale = parseFloat(inputs.s.value);
            ids.forEach(id => { if(displays[id]) displays[id].innerText = inputs[id].value; });
            document.getElementById('machine-body').style.transform = `rotateY(${boxRotationY}deg) rotateX(${boxRotationX}deg)`;
            updateStage(); applyTransform();
        }

        window.resetAll = () => { 
            transform = { ...defaultTransform }; stage = { ...defaultStage }; boxRotationY = 0; boxRotationX = 10;
            // Manually set values back to inputs
            if(inputs.rotY) {
                inputs.rotY.value = 0; inputs.rotX.value = 10; inputs.sw.value = 3.5; inputs.sd.value = 3.0; 
                inputs.li.value = 1.5; inputs.lim.value = 2.5; inputs.y.value = -1.2; inputs.s.value = 1.0;
                updateFromUI();
            }
        };

        function resizeRenderer() { const canvas = document.getElementById('hologram-canvas'); const width = canvas.parentElement.clientWidth; const height = canvas.parentElement.clientHeight; if (renderer) renderer.setSize(width, height); if (camera) { camera.aspect = width / height; camera.updateProjectionMatrix(); } }
        function applyTransform() { if (!currentVrm) return; currentVrm.scene.position.set(transform.x, transform.y, 0); currentVrm.scene.scale.set(transform.scale, transform.scale, transform.scale); currentVrm.scene.rotation.y = transform.rot * (Math.PI / 180); }
        window.toggleWebcam = () => { const cam = document.getElementById('webcam-container'); cam.style.display = cam.style.display === 'none' ? 'block' : 'none'; };

        function clamp(val, min, max) { return Math.min(Math.max(val, min), max); }
        let smoothedX = 0, smoothedY = 0;
        async function trackLoop() {
            if (faceLandmarker && video && video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const results = faceLandmarker.detectForVideo(video, performance.now());
                const camContainer = document.getElementById('webcam-container');
                if (results.faceLandmarks.length > 0) {
                    camContainer.classList.add('tracking');
                    const nose = results.faceLandmarks[0][1];
                    const targetX = (nose.x - 0.5) * 2; const targetY = (nose.y - 0.5) * 2;
                    smoothedX += (targetX - smoothedX) * 0.1; smoothedY += (targetY - smoothedY) * 0.1;
                    const limitedX = clamp(-smoothedX * 6.0, -stage.limit, stage.limit);
                    const limitedY = clamp(0.5 - (smoothedY * 3.0), 0.5 - stage.limit, 0.5 + stage.limit);
                    camera.position.x = limitedX; camera.position.y = limitedY; camera.lookAt(0, 0.5, 0);
                    if (currentVrm) currentVrm.lookAt.target = camera;
                } else { camContainer.classList.remove('tracking'); }
            }
            requestAnimationFrame(trackLoop);
        }

        const clock = new THREE.Clock();
        function animate() { requestAnimationFrame(animate); const d = clock.getDelta(); if (currentVrm) currentVrm.update(d); if (mixer) mixer.update(d); renderer.render(scene, camera); }

        let touchStartX = 0, touchStartY = 0;
        document.addEventListener('touchstart', e => { if(e.target.closest('#controls-panel')) return; touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; });
        document.addEventListener('touchmove', e => { if(e.target.closest('#controls-panel')) return; const deltaX = e.touches[0].clientX - touchStartX; const deltaY = e.touches[0].clientY - touchStartY; boxRotationY += deltaX * 0.5; boxRotationX -= deltaY * 0.5; boxRotationX = clamp(boxRotationX, -45, 45); 
            if(inputs.rotY) { inputs.rotY.value = boxRotationY; inputs.rotX.value = boxRotationX; updateFromUI(); }
            touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; 
        });

    </script>
</body>
